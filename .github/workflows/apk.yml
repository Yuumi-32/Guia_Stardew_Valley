# Monta o APK e o AAB assinados a partir do PWA que está no ar.
#
# Roda só quando você manda: ou pelo botão "Run workflow", ou publicando
# uma tag v* — build de APK não tem por que rodar a cada commit de texto.
#
# Antes da primeira vez, cadastre tres secrets em
# Settings > Secrets and variables > Actions:
#
#   KEYSTORE_BASE64     a sua chave .keystore em base64
#                       (base64 -w0 chave-release.keystore > saida.txt)
#   KEYSTORE_PASSWORD   a senha do keystore
#   KEY_PASSWORD        a senha da chave
#
# O alias nao e secret: sai do campo signingKey.alias do twa-manifest.json.
#
# A chave nunca entra no repositório: ela é decodificada aqui e some com a máquina.

name: APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Recompõe a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > chave-release.keystore

      - name: Instala o Bubblewrap
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Gera o projeto Android
        run: bubblewrap update --skipVersionUpgrade

      - name: Monta APK e AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Confere que o APK está assinado
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose app-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guia-stardew-apk
          path: |
            app-release-signed.apk
            app-release-bundle.aab
          if-no-files-found: error

      # numa tag v*, anexa os arquivos à Release
      - name: Anexa à Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release-signed.apk
            app-release-bundle.aab
